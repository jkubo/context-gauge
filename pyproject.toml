[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "context-gauge"
version = "0.2.1"
description = "Context-saturation gauge for Claude Code and Grok Build — band your reasoning working set (GREEN→BLACK) so you hand off before quality degrades."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
  { name = "jkubo" },
]
keywords = [
  "claude-code",
  "grok",
  "context",
  "tokens",
  "statusline",
  "hooks",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jkubo/context-gauge"
Repository = "https://github.com/jkubo/context-gauge"
Issues = "https://github.com/jkubo/context-gauge/issues"

[project.scripts]
context-gauge = "context_gauge:main"
claude-context-gauge = "context_gauge:main"

[tool.hatch.build.targets.wheel]
only-include = ["context_gauge.py"]

[tool.hatch.build.targets.sdist]
include = [
  "context_gauge.py",
  "context-gauge",
  "claude-context-gauge",
  "install.sh",
  "settings.example.json",
  "hooks.grok.example.json",
  "README.md",
  "LICENSE",
  "tests",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
